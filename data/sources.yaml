# sources.yaml — single source of truth for every citation and on-screen quote.
# Global context: scenes show quotes by `id` (video/widgets.py QuoteCard); README/docs list these
# sources; `uv run pytest -m network` / the verify_sources phase downloads `fetch_url` and checks
# that every quote occurs verbatim (after whitespace + typographic normalisation, sources.py).
# License rule (tests/test_sources.py): quotes from anything other than "CC BY 4.0" stay <= 15 words.
sources:
  - id: turner2024actadd
    short: "Turner et al. 2024, arXiv:2308.10248"
    citation: "Turner, A. M., Thiergart, L., Leech, G., Udell, D., Vazquez, J. J., Mini, U., MacDiarmid, M. (2024). Steering Language Models With Activation Engineering (v1-v4 titled 'Activation Addition: Steering Language Models Without Optimization'). arXiv:2308.10248v5."
    url: "https://arxiv.org/abs/2308.10248"
    fetch_url: "https://arxiv.org/html/2308.10248v5"
    license: "CC BY 4.0"
    quotes:
      - id: actadd_definition
        text: "we introduce activation engineering: the inference-time modification of activations in order to control (or steer) model outputs."
        location: "Abstract"
      - id: actadd_single_pair
        text: "it does not require any machine optimization and works with a single pair of data points"
        location: "Abstract"
      - id: actadd_bias_terms
        text: "These vectors act like “virtual bias terms” because ActAdd directly adds the steering vectors to the forward pass at inference time."
        location: "Section 1"
      - id: actadd_padding
        text: "The contrast pair can be of arbitrary lengths (empirically, right-padding the shorter prompt using whitespace gives good results)."
        location: "Appendix C"
      - id: actadd_coeff_limit
        text: "The injection coefficient cannot be increased indefinitely, as shown by our coefficient sweeps (see Appendix Table 7)."
        location: "Appendix C"
      - id: actadd_middle_layers
        text: "intervening at the middle layers is most effective."
        location: "Section 3, footnote 2"
      - id: actadd_api_access
        text: "ActAdd is not immediately applicable given only API access to a model."
        location: "Section 5 (Limitations)"

  - id: turner2023lw
    short: "Turner et al. 2023, LessWrong"
    citation: "Turner, A. M., Thiergart, L., Udell, D., Leech, G., Mini, U., MacDiarmid, M. (2023). Steering GPT-2-XL by adding an activation vector. LessWrong / AI Alignment Forum."
    url: "https://www.lesswrong.com/posts/5spBue2z2tw4JuDCx/steering-gpt-2-xl-by-adding-an-activation-vector"
    fetch_url: "https://www.greaterwrong.com/posts/5spBue2z2tw4JuDCx/steering-gpt-2-xl-by-adding-an-activation-vector"
    license: "all rights reserved (no license stated)"
    quotes:
      - id: lw_love_hate_setup
        text: "\"Love\" - \"Hate\" before attention layer 6 with coefficient +5"
        location: "Section 'Demonstrations'"
      - id: lw_cherry_picked
        text: "We slightly (best-of-3) cherry-picked our results in order to make the post shorter."
        location: "Introduction"

  - id: actadd_code
    short: "montemac/activation_additions (MIT)"
    citation: "Turner, A. M., MacDiarmid, M., et al. activation_additions: code for ActAdd (GitHub repository, MIT license)."
    url: "https://github.com/montemac/activation_additions"
    fetch_url: "https://raw.githubusercontent.com/montemac/activation_additions/main/README.md"
    license: "MIT"
    quotes:
      - id: code_sampling_kwargs
        text: "temperature=1, freq_penalty=1, top_p=.3"
        location: "README, 'Using ActivationAdditions to generate modified completions'"
      - id: code_love_vector
        text: "love_rp = ActivationAddition(prompt=\"Love\", coeff=5, act_name=\"blocks.6.hook_resid_pre\")"
        location: "README"

  - id: panickssery2024caa
    short: "Rimsky et al. 2024 (CAA), ACL"
    citation: "Rimsky (Panickssery), N., Gabrieli, N., Schulz, J., Tong, M., Hubinger, E., Turner, A. M. (2024). Steering Llama 2 via Contrastive Activation Addition. Proceedings of ACL 2024 (Long Papers), 15504-15522. arXiv:2312.06681."
    url: "https://aclanthology.org/2024.acl-long.828/"
    fetch_url: "https://arxiv.org/html/2312.06681v4"
    license: "CC BY 4.0"
    quotes:
      - id: caa_definition
        text: "CAA computes “steering vectors” by averaging the difference in residual stream activations between pairs of positive and negative examples of a particular behavior, such as factual versus hallucinatory responses."
        location: "Abstract"
      - id: caa_positions
        text: "these steering vectors are added at all token positions after the user’s prompt"
        location: "Abstract"

  - id: subramani2022
    short: "Subramani et al. 2022, Findings of ACL"
    citation: "Subramani, N., Suresh, N., Peters, M. E. (2022). Extracting Latent Steering Vectors from Pretrained Language Models. Findings of ACL 2022, 566-581. arXiv:2205.05124."
    url: "https://aclanthology.org/2022.findings-acl.48/"
    fetch_url: "https://ar5iv.labs.arxiv.org/html/2205.05124"
    license: "CC BY 4.0"
    quotes:
      - id: subramani_add
        text: "During decoding, we add our steering vector to the hidden states of the language model to generate the target sentence."
        location: "Section 1"

