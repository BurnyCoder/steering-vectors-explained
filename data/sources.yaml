        location: "Section 5 (Evaluating Steering Vector Reliability)"

  - id: li2023iti
    short: "Li et al. 2023 (ITI), NeurIPS"
    citation: "Li, K., Patel, O., Viegas, F., Pfister, H., Wattenberg, M. (2023). Inference-Time Intervention: Eliciting Truthful Answers from a Language Model. NeurIPS 2023. arXiv:2306.03341."
