# glossary.yaml — every technical term, the chapter whose narration first defines it, and a one-line definition.
# Global context: tests/test_script.py fails if any alias appears in the narration of an EARLIER chapter
# (enforcing "never mention a word before defining it"); docs/glossary.md is generated from this file.
# Aliases are matched case-insensitively on word boundaries.
terms:
  - {term: language model, chapter: ch00, aliases: [language model], definition: "A program that continues text by repeatedly predicting the next token."}
  - {term: prompt, chapter: ch00, aliases: [prompt, prompts], definition: "The text given to the model to continue."}
  - {term: vector, chapter: ch00, aliases: [vector, vectors], definition: "An ordered list of real numbers (formalised in chapter 1)."}
  - {term: steering vector, chapter: ch00, aliases: [steering vector, steering vectors], definition: "A vector added inside a model to change its behaviour (formalised in chapters 7-8)."}
  - {term: random seed, chapter: ch00, aliases: [seed, seeds], definition: "A number that initialises the random number generator, so a run can be repeated exactly."}
  - {term: scalar, chapter: ch01, aliases: [scalar, scalars], definition: "A single real number."}
  - {term: real number, chapter: ch01, aliases: [real number, real numbers], definition: "Any number on the continuous number line; their set is ℝ."}
  - {term: element of, chapter: ch01, aliases: [element of, elements of], definition: "x ∈ S means x belongs to the set S."}
  - {term: component, chapter: ch01, aliases: [component, components], definition: "One entry of a vector."}
  - {term: dimension, chapter: ch01, aliases: [dimension, dimensions, dimensional], definition: "The number of components d; ℝ^d is the set of all such vectors."}
  - {term: parameters, chapter: ch01, aliases: [parameter, parameters, weights], definition: "The learned numbers that define a model."}
  - {term: training, chapter: ch01, aliases: [training, trained, retraining], definition: "The process that learns a model's parameters from data."}
  - {term: sigma (sum), chapter: ch02, aliases: [sigma], definition: "Σ: add up every term."}
  - {term: mean, chapter: ch02, aliases: [mean, average, averages], definition: "Sum divided by count: (1/n) Σ x_i."}
  - {term: dot product, chapter: ch02, aliases: [dot product, dotted], definition: "a·b = Σ_i a_i b_i, one scalar."}
  - {term: norm, chapter: ch02, aliases: [norm, norms], definition: "Length ‖v‖ = √(v·v)."}
  - {term: unit vector, chapter: ch02, aliases: [unit vector, unit vectors], definition: "A vector of norm 1; v/‖v‖ keeps only the direction."}
  - {term: function, chapter: ch03, aliases: [function, functions], definition: "f: X → Y assigns exactly one output in Y to each input in X."}
  - {term: token, chapter: ch03, aliases: [token, tokens, tokenizer], definition: "A word or word piece with an integer ID."}
  - {term: vocabulary, chapter: ch03, aliases: [vocabulary], definition: "The set V of all tokens; |V| = 50,257 for GPT-2."}
  - {term: position, chapter: ch03, aliases: [position, positions], definition: "A token's index t in the sequence, from 0."}
  - {term: embedding, chapter: ch03, aliases: [embedding], definition: "Function mapping a token (and its position) to a vector in ℝ^d."}
  - {term: layer, chapter: ch04, aliases: [layer, layers], definition: "One of L processing steps; GPT-2-XL has L = 48."}
  - {term: attention, chapter: ch04, aliases: [attention], definition: "Sub-layer that moves information between positions."}
  - {term: MLP, chapter: ch04, aliases: [MLP, multilayer perceptron], definition: "Sub-layer that transforms each position's vector separately."}
  - {term: residual stream, chapter: ch04, aliases: [residual stream], definition: "The running per-position vector that every sub-layer reads from and adds to."}
  - {term: normalization, chapter: ch04, aliases: [normalization], definition: "Rescaling a vector (LayerNorm in GPT-2) before a sub-layer reads it; GPT-2 also normalizes the final stream before W_U."}
  - {term: activation, chapter: ch04, aliases: [activation, activations], definition: "A number or vector computed inside the model, e.g. h_ℓ^(t)."}
  - {term: forward pass, chapter: ch04, aliases: [forward pass], definition: "One run through all layers."}
  - {term: matrix, chapter: ch05, aliases: [matrix], definition: "A rectangular grid of numbers; times a vector = one dot product per row."}
  - {term: logit, chapter: ch05, aliases: [logit, logits], definition: "Unnormalised score per token, z = W_U h."}
  - {term: softmax, chapter: ch05, aliases: [softmax], definition: "p_i = e^{z_i} / Σ_j e^{z_j}."}
  - {term: probability, chapter: ch05, aliases: [probability, probabilities], definition: "Numbers in [0,1] that sum to 1 over all outcomes."}
  - {term: sampling, chapter: ch05, aliases: [sample, samples, sampled, sampling], definition: "Choosing the next token at random according to the probabilities."}
  - {term: linear representation hypothesis, chapter: ch06, aliases: [linear representation hypothesis, hypothesis, hypotheses], definition: "Concepts correspond to directions in activation space."}
  - {term: contrast pair, chapter: ch07, aliases: [contrast pair, contrast pairs], definition: "Two inputs differing mainly in the target concept (p⁺, p⁻)."}
  - {term: ActAdd, chapter: ch07, aliases: [ActAdd, Activation Addition], definition: "Steering with h_ℓ(p⁺) − h_ℓ(p⁻) from a single pair (Turner et al.)."}
  - {term: CAA, chapter: ch07, aliases: [CAA, Contrastive Activation Addition], definition: "Steering with a mean difference over a dataset of triples (Rimsky et al.)."}
  - {term: dataset, chapter: ch07, aliases: [dataset], definition: "A finite set of examples, here triples (p, c⁺, c⁻)."}
  - {term: completion, chapter: ch07, aliases: [completion, completions], definition: "Text that follows a prompt."}
  - {term: mean difference, chapter: ch07, aliases: [mean difference], definition: "(1/|D|) Σ [a(p,c⁺) − a(p,c⁻)]."}
  - {term: cosine similarity, chapter: ch07, aliases: [cosine similarity], definition: "Dot product of two unit vectors, in [−1, 1]."}
  - {term: steering coefficient, chapter: ch08, aliases: [steering coefficient, coefficient, alpha], definition: "Scalar α scaling the added vector; sign sets direction."}
  - {term: control, chapter: ch09, aliases: [control], definition: "A comparison condition identical except for the tested factor."}
  - {term: classifier, chapter: ch09, aliases: [classifier], definition: "A model that assigns a label or score to text."}
  - {term: confidence interval, chapter: ch09, aliases: [confidence interval, confidence intervals], definition: "Range of plausible values for an estimate (here 95%, bootstrap)."}
  - {term: bootstrap, chapter: ch09, aliases: [bootstrap], definition: "Resampling the data with replacement to measure uncertainty."}
  - {term: negative log-likelihood, chapter: ch09, aliases: [negative log-likelihood, log-likelihood], definition: "−(1/T) Σ log p(token_t | earlier tokens): the model's average surprise."}
  - {term: nats, chapter: ch09, aliases: [nats], definition: "Unit of log-likelihood computed with the natural logarithm."}
  - {term: Inference-Time Intervention, chapter: ch10, aliases: [Inference-Time Intervention], definition: "Shifting activations of selected attention heads (Li et al.)."}
  - {term: representation engineering, chapter: ch10, aliases: [representation engineering], definition: "Reading and controlling representation directions (Zou et al.)."}
  - {term: directional ablation, chapter: ch10, aliases: [directional ablation, ablation], definition: "x − (r̂·x) r̂: delete the component along r̂."}
  - {term: projection, chapter: ch10, aliases: [projection], definition: "(r̂·x) r̂: the part of x along the unit vector r̂."}
  - {term: feature, chapter: ch10, aliases: [feature, features], definition: "A learned direction representing one concept."}
